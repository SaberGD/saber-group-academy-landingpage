name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dist/ holds the production build that goes live as-is (src/ is an older version of the
      # site, so the deploy does not rebuild it).
      - name: Check the build
        run: |
          test -f dist/index.html
          for f in $(grep -o '/assets/[^"]*' dist/index.html); do test -f "dist$f" || { echo "missing dist$f"; exit 1; }; done

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp-admin/**
            wp-admin/**/*
            wp-content/**
            wp-content/**/*
            wp-includes/**
            wp-includes/**/*
            **/*.php
            license.txt
            readme.html
            xmlrpc.php
            .user.ini

      # Hostinger's bot protection answers plain curl with 403, so check with a browser user agent.
      - name: Check the live site
        run: |
          EXPECT="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for _ in $(seq 1 24); do
            PAGE="$(curl -fsS -A "$UA" -H "Cache-Control: no-cache" "https://sabergroupacademy.com/?v=$RANDOM" || true)"
            if [[ "$PAGE" == *"$EXPECT"* ]]; then echo "live: serves $EXPECT"; exit 0; fi
            sleep 5
          done
          echo "the live site does not serve $EXPECT after 2 minutes" >&2
          exit 1
